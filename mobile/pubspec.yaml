name: tariq_cash_and_carry_mart
description: Tariq Cash and Carry Mart grocery shopping app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/tariq_mart_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/tariq_mart_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/tariq_mart_logo.png
  remove_alpha_ios: true

